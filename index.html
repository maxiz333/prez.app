const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString();}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);return isNaN(d)?'—':
  d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtEuro(v){return '€ '+num(v).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});}
function monthsSince(iso){if(!iso)return 999;const d=new Date(iso);if(isNaN(d))return 999;
  const n=new Date();return (n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth())
  -(n.getDate()<d.getDate()?1:0);}
function daysSince(iso){if(!iso)return 99999;const d=new Date(iso);if(isNaN(d))return 99999;
  return Math.max(0, Math.floor((Date.now()-d)/86400000));}

/* Badge anzianità: settimane nel primo mese, poi mesi */
function ageInfo(iso){
  if(!iso) return {cls:'age-red', label:'—'};
  const d = new Date(iso);
  if(isNaN(d)) return {cls:'age-red', label:'—'};
  const days = daysSince(iso);
  const m = monthsSince(iso);

  let cls;
  if(m <= 3) cls = 'age-green';
  else if(m <= 6) cls = 'age-yellow';
  else if(m <= 12) cls = 'age-orange';
  else cls = 'age-red';

  let label;
  if(days <= 6) label = 'nuovo';
  else if(days <= 13) label = '1 set';
  else if(days <= 20) label = '2 set';
  else if(days <= 27) label = '3 set';
  else {
    let mm = m;
    if(mm < 1) mm = 1;
    label = mm + (mm === 1 ? ' mese' : ' mesi');
  }

  return {cls, label};
}

/* ============================================================================
   RICERCA INTELLIGENTE
   ========================================================================== */
function normalizeStr(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function tokenMatch(token, hayWords, hayFull){
  if(!token) return true;
  if(hayFull.includes(token)) return true;
  if(token.length < 4) return false;
  const stem = token.replace(/[aeiou]$/,'');
  if(stem.length < 3) return false;
  return hayWords.some(w => w.startsWith(stem));
}
function smartMatch(hay, query){
  if(!query) return true;
  const tokens = query.split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const hayWords = hay.split(/\s+/);
  return tokens.every(t => tokenMatch(t, hayWords, hay));
}
function smartScore(hay, query){
  if(!query) return 0;
  const tokens = query.split(/\s+/).filter(Boolean);
  const hayWords = hay.split(/\s+/);
  let score = 0;
  tokens.forEach(t => {
    if(hay.startsWith(t)) score += 50;
    else if(hayWords.some(w => w === t)) score += 30;
    else if(hayWords.some(w => w.startsWith(t))) score += 20;
    else if(hay.includes(t)) score += 5;
    else {
      const stem = t.replace(/[aeiou]$/,'');
      if(stem.length >= 3 && hayWords.some(w => w.startsWith(stem))) score += 3;
    }
  });
  if(hay.length < 30) score += 5;
  return score;
}

/* -------- RUBRICA -------- */
function getRubrica(){return Array.isArray(window.RUBRICA_ARTICOLI)?window.RUBRICA_ARTICOLI:[];}

function searchRubrica(query){
  const q = normalizeStr(query);
  if(q.length < 2) return [];
  const rub = getRubrica();
  const matches = [];
  for(let i=0; i<rub.length; i++){
    const r = rub[i];
    if(!r) continue;
    const hay = normalizeStr((r.cod||'') + ' ' + (r.nome||''));
    if(smartMatch(hay, q)){
      matches.push({r, score: smartScore(hay, q)});
    }
  }
  matches.sort((a,b) => b.score - a.score);
  return matches.slice(0, 50).map(x => x.r);
}

function renderRubricaResults(results){
  const box=$('#rubricaResults');if(!box)return;
  if(!results.length){box.style.display='none';box.innerHTML='';return;}
  box.style.display='block';
  box.innerHTML=results.map((r,i)=>`
    <div class="rubrica-item" data-idx="${i}">
      <div class="rb-name"><span class="rb-code">${esc(r.cod)}</span>${esc(r.nome)}</div>
      <div class="rb-meta">Unità: ${esc(r.unit||'pz')}</div>
    </div>`).join('');
  box.querySelectorAll('.rubrica-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.idx,10);
      const r=results[idx];if(!r)return;
      $('#naName').value=r.nome||'';
      $('#naCode').value=r.cod||'';
      $('#naUnit').value=(r.unit && UNIT_LBL[r.unit])?r.unit:'pz';
      box.style.display='none';
      $('#rubricaSearch').value=r.cod+' — '+r.nome;
      setTimeout(()=>$('#naPrice').focus(),50);
    });
  });
}

/* -------- COMPRESSIONE FOTO -------- */
function compressImage(file,maxPx=MAX_PHOTO_PX,quality=PHOTO_QUALITY){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Errore lettura file'));
    r.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Immagine non valida'));
      img.onload=()=>{
        try{
          let{w:width,h:height}=img;
          if(w>h){if(w>maxPx){h=h*maxPx/w;w=maxPx;}}
          else{if(h>maxPx){w=w*maxPx/h;h=maxPx;}}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',quality));
        }catch(err){reject(err);}
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* ============================================================================
   SALVATAGGIO — SOLO CLOUD
   ========================================================================== */
function saveState(silent=false){
  try{ if(window.cloudPush) window.cloudPush(false); }catch(e){}
  setInfo('save','● Salvo online...','ok');
  return true;
}

function normalizeState(p){
  if(!p||!Array.isArray(p.categories)) throw new Error('Struttura non valida');
  p.version=APP_VERSION;
  p.meta=p.meta||{operator:'',lastRevision:new Date().toISOString(),globalMargin:40};
  if(typeof p.meta.globalMargin!=='number') p.meta.globalMargin=40;
  if(!p.meta.operator) p.meta.operator='';
  if(!p.meta.lastRevision) p.meta.lastRevision=new Date().toISOString();
  p.categories.forEach(c=>{
    c.id=c.id||uid();
    c.parentId=c.parentId||null;
    c.name=String(c.name||'Senza nome').slice(0,200);
    if(typeof c.defaultMargin!=='number') c.defaultMargin=40;
    c.articles=Array.isArray(c.articles)?c.articles:[];
    c.articles.forEach(a=>{
      a.id=a.id||uid();
      a.name=String(a.name||'Senza nome').slice(0,300);
      a.code=String(a.code||'').slice(0,100);
      a.unit=UNIT_LBL[a.unit]?a.unit:'pz';
      a.photo=typeof a.photo==='string'?a.photo:'';
      a.supplier=String(a.supplier||'').slice(0,200);
      a.supplierCode=String(a.supplierCode||'').slice(0,100);
      a.notes=String(a.notes||'').slice(0,1000);
      a.price=num(a.price);a.cost=num(a.cost);
      a.margin=(typeof a.margin==='number'&&!isNaN(a.margin))?a.margin:null;
      a.purchases=Array.isArray(a.purchases)?a.purchases:[];
      a.purchases.forEach(pp=>{pp.id=pp.id||uid();pp.cost=num(pp.cost);pp.qty=num(pp.qty);
        if(!pp.date)pp.date=new Date().toISOString();});
      a.quantityDiscounts=Array.isArray(a.quantityDiscounts)?a.quantityDiscounts:[];
      a.quantityDiscounts.forEach(s=>{s.id=s.id||uid();s.minQty=num(s.minQty);s.discountPct=num(s.discountPct);});
      a.linkedArticles=Array.isArray(a.linkedArticles)?a.linkedArticles:[];
      a.linkedArticles.forEach(la=>{
        la.articleId = la.articleId || '';
        la.note = String(la.note||'').slice(0,200);
        la.required = (la.required === true || la.required === 'req');
      });
      a.history=Array.isArray(a.history)?a.history:[];
      if(!a.updatedAt) a.updatedAt=new Date().toISOString();
    });
  });
  return p;
}

let state=null;
let activeCategoryId=null;
let activeSubCategoryId=null;
let activeFilter='all';

/* -------- UNDO/REDO -------- */
let undoStack=[];
let redoStack=[];
function pushUndo(label){
  try{
    undoStack.push({label,snapshot:JSON.stringify(state)});
    if(undoStack.length>MAX_UNDO) undoStack.shift();
    redoStack=[];
    updateUndoButtons();
  }catch(e){}
}
function undo(){
  if(!undoStack.length) return;
  const entry=undoStack.pop();
  try{
    redoStack.push({label:entry.label,snapshot:JSON.stringify(state)});
    state=normalizeState(JSON.parse(entry.snapshot));
    if(!state.categories.find(c=>c.id===activeCategoryId)){
      const firstTop = state.categories.find(c=>!c.parentId);
      activeCategoryId = firstTop ? firstTop.id : null;
      activeSubCategoryId = null;
    }
    saveState(true);render();updateUndoButtons();
    setInfo('save','↶ Annullato: '+entry.label,'warn');
  }catch(e){console.warn('Undo fallito',e);}
}
function redo(){
  if(!redoStack.length) return;
  const entry=redoStack.pop();
  try{
    undoStack.push({label:entry.label,snapshot:JSON.stringify(state)});
    state=normalizeState(JSON.parse(entry.snapshot));
    if(!state.categories.find(c=>c.id===activeCategoryId)){
      const firstTop = state.categories.find(c=>!c.parentId);
      activeCategoryId = firstTop ? firstTop.id : null;
      activeSubCategoryId = null;
    }
    saveState(true);render();updateUndoButtons();
    setInfo('save','↷ Ripetuto: '+entry.label,'warn');
  }catch(e){console.warn('Redo fallito',e);}
}
function updateUndoButtons(){
  const u=$('#btnUndo'),r=$('#btnRedo');
  if(u)u.disabled=!undoStack.length;
  if(r)r.disabled=!redoStack.length;
  const badge=$('#undoBadge');
  if(badge){
    if(undoStack.length){badge.textContent=undoStack.length;badge.style.display='inline-block';}
    else badge.style.display='none';
  }
}
$('#btnUndo').addEventListener('click',undo);
$('#btnRedo').addEventListener('click',redo);

/* -------- LOOKUP -------- */
function getActiveCategory(){return state.categories.find(c=>c.id===activeCategoryId)||null;}
function getActiveSubCategory(){return activeSubCategoryId ? state.categories.find(c=>c.id===activeSubCategoryId) : null;}
function getCurrentArticleOwner(){return getActiveSubCategory() || getActiveCategory();}
function findArticle(id){for(const c of state.categories){const a=c.articles.find(x=>x.id===id);if(a)return a;}return null;}

function searchCategories(query){
  const q = normalizeStr(query);
  if(q.length < 2) return [];
  return state.categories.filter(c => smartMatch(normalizeStr(c.name), q)).slice(0, 10);
}

function matchesFilter(a){
  if(!a || !a.updatedAt) return true;
  const m = monthsSince(a.updatedAt);
  if(activeFilter === '3'  && m < 3)  return false;
  if(activeFilter === '6'  && m < 6)  return false;
  if(activeFilter === '12' && m < 12) return false;
  return true;
}

function getFilteredArticles(){
  const q = normalizeStr(searchQuery);
  if(q){
    const results = [];
    state.categories.forEach(cat=>{
      cat.articles.forEach(a=>{
        const hay = normalizeStr(a.name + ' ' + (a.code||'') + ' ' + (a.notes||'') + ' ' + (a.supplier||'') + ' ' + (a.supplierCode||''));
        if(!smartMatch(hay, q)) return;
        if(!matchesFilter(a)) return;
        results.push({
          a: Object.assign({}, a, {_searchCatName:cat.name, _searchCatId:cat.id}),
          score: smartScore(hay, q)
        });
      });
    });
    results.sort((a,b) => b.score - a.score);
    return results.map(x => x.a);
  }
  const owner = getCurrentArticleOwner();
  if(!owner) return [];
  return owner.articles.filter(matchesFilter);
}

/* -------- RENDER TABS -------- */
function renderTabs(){
  const tabs=$('#tabs');tabs.innerHTML='';
  const topLevel = state.categories.filter(c => !c.parentId);

  topLevel.forEach(cat=>{
    const isActive = (cat.id===activeCategoryId);
    const children = state.categories.filter(c => c.parentId === cat.id);
    const childArticleCount = children.reduce((s,c)=> s + c.articles.length, 0);
    const totalCount = cat.articles.length + childArticleCount;
    const hasChildren = children.length > 0;

    const b=document.createElement('button');
    b.className='tab'+(isActive?' active':'')+(hasChildren?' has-children':'');
    b.dataset.cat=cat.id;
    b.innerHTML='<span class="tab-name">'+esc(cat.name)+'</span>'
      + (hasChildren?' <span class="tab-arrow">▾</span>':'')
      + ' <span class="count">'+totalCount+'</span>';
    b.addEventListener('click',()=>{
      if(activeCategoryId === cat.id) return;
      activeCategoryId=cat.id;
      activeSubCategoryId=null;
      selectedArticles.clear();
      if(searchQuery.trim()){
        searchQuery='';
        const si=$('#searchInput'); if(si) si.value='';
      }
      if(selectionMode) exitSelectionMode();
      updateSelectionBar();
      updateSearchBar();
      render();
    });
    b.addEventListener('contextmenu',e=>{
      e.preventDefault();
      openTabMenu(cat.id);
    });
    let lpTimer=null, lpTriggered=false;
    b.addEventListener('touchstart',()=>{
      lpTriggered=false;
      lpTimer=setTimeout(()=>{
        lpTriggered=true;
        openTabMenu(cat.id);
        if(navigator.vibrate){ try{ navigator.vibrate(20); }catch(e){} }
      }, 600);
    }, {passive:true});
    b.addEventListener('touchend',(e)=>{
      clearTimeout(lpTimer);
      if(lpTriggered){ e.preventDefault(); e.stopPropagation(); }
    });
    b.addEventListener('touchmove',()=>{ clearTimeout(lpTimer); }, {passive:true});
    tabs.appendChild(b);
  });

  const activeCat = state.categories.find(c => c.id === activeCategoryId);
  const subRow = $('#subtabs');
  if(subRow){
    subRow.innerHTML='';
    if(activeCat && !activeCat.parentId){
      const children = state.categories.filter(c => c.parentId === activeCat.id);
      if(children.length > 0){
        subRow.style.display='flex';
        const allBtn = document.createElement('button');
        const allActive = (activeSubCategoryId === null);
        allBtn.className='subtab'+(allActive?' active':'');
        allBtn.innerHTML='Tutti <span class="count">'+activeCat.articles.length+'</span>';
        allBtn.addEventListener('click',()=>{
          activeSubCategoryId=null;
          selectedArticles.clear();
          if(selectionMode) exitSelectionMode();
          updateSelectionBar();
          render();
        });
        subRow.appendChild(allBtn);
        children.forEach(child=>{
          const isActive = (activeSubCategoryId === child.id);
          const sb=document.createElement('button');
          sb.className='subtab'+(isActive?' active':'');
          sb.dataset.subcat=child.id;
          sb.innerHTML=esc(child.name)+' <span class="count">'+child.articles.length+'</span>';
          sb.addEventListener('click',()=>{
            activeSubCategoryId=child.id;
            selectedArticles.clear();
            if(selectionMode) exitSelectionMode();
            updateSelectionBar();
            render();
          });
          sb.addEventListener('contextmenu',e=>{ e.preventDefault(); openTabMenu(child.id); });
          let lpTimer=null, lpTriggered=false;
          sb.addEventListener('touchstart',()=>{
            lpTriggered=false;
            lpTimer=setTimeout(()=>{
              lpTriggered=true;
              openTabMenu(child.id);
              if(navigator.vibrate){ try{ navigator.vibrate(20); }catch(e){} }
            }, 600);
          }, {passive:true});
          sb.addEventListener('touchend',(e)=>{
            clearTimeout(lpTimer);
            if(lpTriggered){ e.preventDefault(); e.stopPropagation(); }
          });
          sb.addEventListener('touchmove',()=>{ clearTimeout(lpTimer); }, {passive:true});
          subRow.appendChild(sb);
        });
        const addBtn = document.createElement('button');
        addBtn.className='subtab subtab-add';
        addBtn.textContent='+';
        addBtn.title='Aggiungi sotto-settore';
        addBtn.addEventListener('click',()=>addSubCategory(activeCat.id));
        subRow.appendChild(addBtn);
      } else {
        subRow.style.display='none';
      }
    } else {
      subRow.style.display='none';
    }
  }
}

/* -------- MENU CONTESTUALE TAB -------- */
let tabMenuCategoryId = null;

function openTabMenu(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  tabMenuCategoryId = catId;
  $('#tabMenuTitle').textContent = cat.name;
  const parent = cat.parentId ? state.categories.find(c=>c.id===cat.parentId) : null;
  $('#tabMenuSub').textContent = parent ? 'Sotto-settore di ' + parent.name : 'Settore principale';

  const siblings = state.categories.filter(c => c.parentId === cat.parentId);
  const idx = siblings.findIndex(c => c.id === catId);

  $('#tabMenuMoveLeft').disabled = (idx <= 0);
  $('#tabMenuMoveRight').disabled = (idx >= siblings.length - 1);
  $('#tabMenuAddSub').style.display = cat.parentId ? 'none' : 'inline-flex';

  openModal('#modalTabMenu');
}

$('#tabMenuRename').addEventListener('click', ()=>{
  const id = tabMenuCategoryId;
  closeModal('#modalTabMenu');
  if(!id) return;
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  const name = prompt('Nuovo nome:', cat.name);
  if(name===null) return;
  const t = name.trim(); if(!t) return;
  pushUndo('Rinomina settore');
  cat.name = t.slice(0,200);
  saveState(); render();
});

$('#tabMenuAddSub').addEventListener('click', ()=>{
  const parentId = tabMenuCategoryId;
  closeModal('#modalTabMenu');
  if(parentId) setTimeout(()=>addSubCategory(parentId), 150);
});

$('#tabMenuMoveLeft').addEventListener('click', ()=>{
  const id = tabMenuCategoryId;
  closeModal('#modalTabMenu');
  if(id) moveCategory(id, -1);
});
$('#tabMenuMoveRight').addEventListener('click', ()=>{
  const id = tabMenuCategoryId;
  closeModal('#modalTabMenu');
  if(id) moveCategory(id, +1);
});

$('#tabMenuDelete').addEventListener('click', ()=>{
  const id = tabMenuCategoryId;
  closeModal('#modalTabMenu');
  if(!id) return;
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  const children = state.categories.filter(c => c.parentId === id);
  let msg = 'Eliminare il settore "'+cat.name+'"?';
  if(children.length) msg += '\n\nVerranno eliminati anche '+children.length+' sotto-settori.';
  if(cat.articles.length) msg += '\n\nVerranno eliminati anche '+cat.articles.length+' articoli.';
  if(!confirm(msg + '\n\nRecuperabile con Ctrl+Z.')) return;
  pushUndo('Elimina settore "'+cat.name+'"');
  state.categories = state.categories.filter(c => c.id !== id && c.parentId !== id);
  if(activeCategoryId === id || activeSubCategoryId === id){
    const firstTop = state.categories.find(c => !c.parentId);
    activeCategoryId = firstTop ? firstTop.id : null;
    activeSubCategoryId = null;
  }
  saveState(); render();
});

function addSubCategory(parentId){
  const parent = state.categories.find(c=>c.id===parentId);
  if(!parent) return;
  const name = prompt('Nome del sotto-settore (es. Coperchi):');
  if(name===null) return;
  const t = name.trim(); if(!t) return;
  pushUndo('Nuovo sotto-settore "'+t+'"');
  const cat = {
    id: uid(),
    name: t.slice(0,200),
    parentId: parentId,
    defaultMargin: parent.defaultMargin || 40,
    articles: []
  };
  state.categories.push(cat);
  activeSubCategoryId = cat.id;
  saveState(); render();
}

function moveCategory(catId, direction){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;
  const siblings = state.categories.filter(c => c.parentId === cat.parentId);
  const idx = siblings.findIndex(c => c.id === catId);
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= siblings.length) return;
  const i1 = state.categories.indexOf(siblings[idx]);
  const i2 = state.categories.indexOf(siblings[newIdx]);
  if(i1 < 0 || i2 < 0) return;
  pushUndo('Sposta settore');
  [state.categories[i1], state.categories[i2]] = [state.categories[i2], state.categories[i1]];
  saveState(); render();
}

/* -------- RENDER TABLE -------- */
function renderTable(){
  const tbody=$('#tableBody');tbody.innerHTML='';

  if(!cloudReady){
    tbody.innerHTML='<tr><td colspan="10"><div class="empty-state">'+
      '<div class="sync-spinner"></div>'+
      '<strong>☁️ Sincronizzazione in corso...</strong>'+
      '<p>Sto caricando i dati dal cloud. Attendi qualche secondo.</p>'+
      '</div></td></tr>';
    updateSelectionBar();
    updateSearchBar();
    return;
  }

  const articles=getFilteredArticles();
  const isSearching = !!searchQuery.trim();
  if(!articles.length){
    tbody.innerHTML='<tr><td colspan="10"><div class="empty-state"><div class="big">📦</div>'+
      '<strong>'+(isSearching?'Nessun risultato':'Nessun articolo da mostrare')+'</strong><p>'+
      (isSearching?'Prova con un altro termine di ricerca.':'Aggiungi il primo articolo con "+ Articolo".')+
      '</p></div></td></tr>';
    updateSelectionBar();
    updateSearchBar();
    return;
  }
  const frag=document.createDocumentFragment();
  articles.forEach(a=>{
    const age=ageInfo(a.updatedAt);
    const marginPct=a.price>0?((a.price-a.cost)/a.price*100):0;
    const marginCls=a.price<a.cost?'margin-bad':(marginPct<15?'margin-warn':'margin-good');
    const isLoss=a.price<a.cost && a.cost>0;
    const supLine=[a.supplier,a.supplierCode].filter(Boolean).join(' • ');
    const thumbHtml=a.photo
      ?'<img class="photo-thumb" src="'+esc(a.photo)+'" alt="">'
      :'<div class="photo-ph">📷</div>';
    const isSel=selectedArticles.has(a.id);
    const hasSconti=a.quantityDiscounts && a.quantityDiscounts.length>0;
    const codeBadge = a.code ? '<span class="art-code-badge">'+esc(a.code)+'</span>' : '';
    const priceBadge = '<span class="art-price-badge">'+fmtEuro(a.price)+unitSuffix(a.unit)+'</span>';
    const catBadge = a._searchCatName ? '<span class="search-cat-badge">📁 '+esc(a._searchCatName)+'</span>' : '';
    const linkedCount = (a.linkedArticles||[]).length;
    const linkedBadge = linkedCount > 0
      ? '<button class="linked-btn" data-linked-open="'+a.id+'" title="Articoli correlati">🔗 '+linkedCount+'</button>'
      : '';
    const plusBtn = linkedCount > 0
      ? '<button class="linked-open-btn" data-open-corr="'+a.id+'" title="Apri calcolatore correlati">+</button>'
      : '';

    const tr=document.createElement('tr');
    tr.dataset.art=a.id;
    if(isLoss)tr.classList.add('row-loss');
    if(isSel)tr.classList.add('row-selected');
    tr.innerHTML=`
      <td class="td-check"><input type="checkbox" data-check="${a.id}" ${isSel?'checked':''}></td>
      <td class="td-name">
        <div class="row-head">
          ${thumbHtml}
          <div class="name-wrap">
            <span class="art-name" data-open="${a.id}">${esc(a.name)}</span>${priceBadge}${codeBadge}${plusBtn}${linkedBadge}${catBadge}
            <span class="age-badge ${age.cls}">${age.label}</span>
            ${hasSconti?'<span class="sconto-badge" title="Sconti quantità">💰 '+a.quantityDiscounts.length+'</span>':''}
            ${supLine?'<div class="art-sub"><span class="sup">'+esc(supLine)+'</span></div>':''}
          </div>
        </div>
      </td>
      <td style="text-align:center"><span class="unit-pill">${esc(a.unit||'pz')}</span></td>
      <td style="text-align:right">
        <input type="number" step="0.01" min="0" class="cell-input num price-in"
               value="${a.price.toFixed(2)}" data-field="price" data-id="${a.id}">
      </td>
      <td style="text-align:right">
        <input type="number" step="0.01" min="0" class="cell-input num cost-in"
               value="${a.cost.toFixed(2)}" data-field="cost" data-id="${a.id}">
      </td>
      <td class="margin-cell ${marginCls}">${isLoss?'⚠ ':''}${marginPct.toFixed(1)}%</td>
      <td class="date-cell">${fmtDate(a.updatedAt)}</td>
      <td class="date-cell">${esc(a.supplier||'—')}</td>
      <td><input type="text" class="cell-input notes" value="${esc(a.notes)}"
          placeholder="—" data-field="notes" data-id="${a.id}"></td>
      <td class="row-actions">
        <button class="edit" data-open="${a.id}" title="Apri scheda">✎</button>
        <button class="del"  data-del="${a.id}"  title="Elimina">🗑</button>
      </td>`;
    frag.appendChild(tr);

    if(linkedCount > 0){
      const correlatiHtml = (a.linkedArticles||[]).map(la=>{
        const linked = findArticle(la.articleId);
        if(!linked) return '';
        return `<label class="correlato-check">
          <input type="checkbox" data-parent="${a.id}" data-corr-id="${linked.id}" data-corr-price="${linked.price}">
          <span class="cc-code">${esc(linked.code||'—')}</span>
          <span class="cc-name">${esc(linked.name)}</span>
          <span class="cc-price">${fmtEuro(linked.price)}</span>
        </label>`;
      }).filter(Boolean).join('');

      const tr2 = document.createElement('tr');
      tr2.className = 'correlati-row';
      tr2.dataset.for = a.id;
      tr2.style.display = 'none';
      tr2.innerHTML = `
        <td colspan="10">
          <div class="correlati-panel">
            <div class="cp-title">🔗 Articoli correlati — spunta per calcolare il totale</div>
            <div class="correlati-list">${correlatiHtml}</div>
            <div class="correlati-total">
              <span class="ct-label">Totale</span>
              <div class="ct-right">
                <span class="ct-value" data-parent="${a.id}">${fmtEuro(a.price)}</span>
              </div>
            </div>
          </div>
        </td>`;
      frag.appendChild(tr2);
    }
  });
  tbody.appendChild(frag);
  updateSelectionBar();
  updateCheckAllState();
  updateSearchBar();
}

function refreshRow(art){
  const tr=document.querySelector('tr[data-art="'+art.id+'"]');
  if(!tr){renderTable();return;}
  const age=ageInfo(art.updatedAt);
  const marginPct=art.price>0?((art.price-art.cost)/art.price*100):0;
  const marginCls=art.price<art.cost?'margin-bad':(marginPct<15?'margin-warn':'margin-good');
  const isLoss=art.price<art.cost && art.cost>0;
  tr.classList.toggle('row-loss',isLoss);
  const ageBadge=tr.querySelector('.age-badge');
  if(ageBadge){ageBadge.className='age-badge '+age.cls;ageBadge.textContent=age.label;}
  const mc=tr.querySelector('.margin-cell');
  if(mc){mc.className='margin-cell '+marginCls;mc.innerHTML=(isLoss?'⚠ ':'')+marginPct.toFixed(1)+'%';}
  tr.querySelector('.date-cell').textContent=fmtDate(art.updatedAt);

  // FIX BUG: non resettare l'input mentre l'utente sta digitando
  const priceIn = tr.querySelector('.price-in');
  const costIn  = tr.querySelector('.cost-in');
  if(priceIn && document.activeElement !== priceIn){
    priceIn.value = art.price.toFixed(2);
  }
  if(costIn && document.activeElement !== costIn){
    costIn.value = art.cost.toFixed(2);
  }

  const pb = tr.querySelector('.art-price-badge');
  if(pb) pb.textContent = fmtEuro(art.price) + unitSuffix(art.unit);
}

function updateSelectionBar(){
  const n=selectedArticles.size;
  const cnt=$('#selBarCount');if(cnt)cnt.textContent=n;
  const btn=$('#btnSelPrint');
  if(btn)btn.textContent = n>0 ? '🖨 Stampa ('+n+')' : '🖨 Stampa tutto';
  const arts=getFilteredArticles();
  const allSel=arts.length>0 && arts.every(a=>selectedArticles.has(a.id));
  const btnAll=$('#btnSelAllBar');
  if(btnAll) btnAll.textContent = allSel ? 'Deseleziona tutti' : 'Seleziona tutti';
}

function updateCheckAllState(){
  const boxes=$$('#tableBody input[data-check]');
  const all=boxes.length>0 && Array.from(boxes).every(b=>b.checked);
  const head=$('#checkAllHead');if(head)head.checked=all;
}

function updateSearchBar(){
  const q=searchQuery.trim();
  const bar=$('#searchInfo');
  const label=$('#searchQueryLabel');
  const cnt=$('#searchResultsCount');
  const catBox=$('#searchCatResults');
  if(q){
    document.body.classList.add('searching');
    if(label) label.textContent='"'+q+'"';
    if(cnt) cnt.textContent=getFilteredArticles().length;
    const si=$('#searchInput'); if(si) si.placeholder='Ricerca in tutti i settori...';
    if(catBox){
      const cats = searchCategories(q);
      if(cats.length){
        catBox.innerHTML='<span class="sc-label">Vai al settore:</span>'
          + cats.map(c=>'<button class="sc-pill" data-goto-cat="'+c.id+'">'+(c.parentId?'↳ ':'📁 ')+esc(c.name)+'</button>').join('');
        catBox.style.display='flex';
        catBox.querySelectorAll('[data-goto-cat]').forEach(el=>{
          el.addEventListener('click',()=>{
            const catId = el.dataset.gotoCat;
            const cat = state.categories.find(c=>c.id===catId);
            if(!cat) return;
            if(cat.parentId){
              activeCategoryId = cat.parentId;
              activeSubCategoryId = cat.id;
            } else {
              activeCategoryId = cat.id;
              activeSubCategoryId = null;
            }
            searchQuery='';
            const si=$('#searchInput'); if(si) si.value='';
            selectedArticles.clear();
            if(selectionMode) exitSelectionMode();
            render();
          });
        });
      } else {
        catBox.style.display='none';
      }
    }
  } else {
    document.body.classList.remove('searching');
    const si=$('#searchInput'); if(si) si.placeholder='Cerca in tutti i settori: articolo, codice, fornitore...';
    if(catBox) catBox.style.display='none';
  }
  if(bar) bar.style.display = q ? 'flex' : 'none';
}

function render(){
  renderTabs();
  renderTable();
  updateInfoBar();
  if(window.__resetCompact) window.__resetCompact();
}

  selectionMode=true;

  renderTable();
  updateSelectionBar();

  if(btnAll) btnAll.textContent='Seleziona tutti';
}

  selectionMode=false;
  selectedArticles.clear();

}

/* -------- MODIFICHE INLINE -------- */
let editSnapshotTaken=false;
$('#tableBody').addEventListener('focusin',e=>{
  if(e.target.matches('.cell-input')) editSnapshotTaken=false;
});

$('#tableBody').addEventListener('input',e=>{
  const inp=e.target;
  if(!inp.dataset||!inp.dataset.field)return;
  const art=findArticle(inp.dataset.id);if(!art)return;
  const fld=inp.dataset.field;
  if(fld==='price'||fld==='cost'){
    const val=parseFloat(inp.value);if(isNaN(val)||val<0)return;
    const old=art[fld];if(old===val)return;
    if(!editSnapshotTaken){
      pushUndo('Modifica '+fld+' di "'+art.name+'"');
      editSnapshotTaken=true;
    }
    art[fld]=val;
    art.history.push({
      date:new Date().toISOString(),price:art.price,cost:art.cost,
      prevPrice:fld==='price'?old:art.price,prevCost:fld==='cost'?old:art.cost,
      operator:state.meta.operator||''
    });
    art.updatedAt=new Date().toISOString();
    state.meta.lastRevision=art.updatedAt;
    saveState();refreshRow(art);updateInfoBar();
  }
});

/* Su blur, riformatta l'input a 2 decimali */
$('#tableBody').addEventListener('focusout',e=>{
  const inp = e.target;
  if(!inp.matches || !inp.matches('.price-in, .cost-in')) return;
  const art = findArticle(inp.dataset.id);
  if(!art) return;
  const fld = inp.dataset.field;
  inp.value = art[fld].toFixed(2);
});

$('#tableBody').addEventListener('change',e=>{
  const inp=e.target;
  if(!inp.dataset)return;
  if(inp.dataset.field==='notes'){
    const art=findArticle(inp.dataset.id);if(!art)return;
    if(art.notes===inp.value)return;
    pushUndo('Modifica note di "'+art.name+'"');
    art.notes=inp.value;art.updatedAt=new Date().toISOString();
    state.meta.lastRevision=art.updatedAt;
    saveState();updateInfoBar();
  }
  if(inp.dataset.check){
    if(inp.checked)selectedArticles.add(inp.dataset.check);
    else selectedArticles.delete(inp.dataset.check);
    const tr=inp.closest('tr');if(tr)tr.classList.toggle('row-selected',inp.checked);
    updateSelectionBar();
    updateCheckAllState();
  }
  if(inp.dataset.parent && inp.dataset.corrPrice !== undefined){
    recalcCorrelatiTotal(inp.dataset.parent);
  }
});

$('#tableBody').addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.tagName==='INPUT') e.target.blur();
});

$('#tableBody').addEventListener('click',e=>{
  if(selectionMode){
    const tr=e.target.closest('tr');
    if(tr && tr.dataset.art && !e.target.closest('button') && !e.target.closest('.correlati-row')){
      if(e.target.tagName==='INPUT'){
        if(e.target.dataset.check) return;
        return;
      }
      const id=tr.dataset.art;
      if(selectedArticles.has(id)) selectedArticles.delete(id);
      else selectedArticles.add(id);
      tr.classList.toggle('row-selected', selectedArticles.has(id));
      const cb=tr.querySelector('input[data-check]');
      if(cb) cb.checked = selectedArticles.has(id);
      updateSelectionBar();
      updateCheckAllState();
      return;
    }
  }
  const corrBtn=e.target.closest('[data-open-corr]');
  if(corrBtn){
    e.stopPropagation();
    toggleCorrelatiPanel(corrBtn.dataset.openCorr, corrBtn);
    return;
  }
  const linkedBtn=e.target.closest('[data-linked-open]');
  if(linkedBtn){
    e.stopPropagation();
    showLinkedPopup(linkedBtn.dataset.linkedOpen);
    return;
  }
  const openBtn=e.target.closest('[data-open]');
  if(openBtn){openArticleModal(openBtn.dataset.open);return;}
  const delBtn=e.target.closest('[data-del]');
  if(delBtn){deleteArticle(delBtn.dataset.del);return;}
});

/* -------- TENDINA CORRELATI TABELLA -------- */
function toggleCorrelatiPanel(artId, btn){
  document.querySelectorAll('.correlati-row').forEach(r=>{
    if(r.dataset.for !== artId) r.style.display = 'none';
  });
  document.querySelectorAll('.linked-open-btn').forEach(b=>{
    if(b !== btn) b.classList.remove('rotated');
  });

  const row = document.querySelector('.correlati-row[data-for="'+artId+'"]');
  if(!row) return;

  if(row.style.display === 'none'){
    row.style.display = 'table-row';
    btn.classList.add('rotated');
    recalcCorrelatiTotal(artId);
  } else {
    row.style.display = 'none';
    btn.classList.remove('rotated');
  }
}

function recalcCorrelatiTotal(parentId){
  const parent = findArticle(parentId);
  if(!parent) return;
  let total = parent.price;
  let count = 0;
  document.querySelectorAll('input[data-parent="'+parentId+'"][type="checkbox"]').forEach(cb=>{
    if(cb.checked){
      total += parseFloat(cb.dataset.corrPrice) || 0;
      count++;
    }
  });
  const val = document.querySelector('.ct-value[data-parent="'+parentId+'"]');
  if(val) val.textContent = fmtEuro(total);
}

document.addEventListener('click', e=>{
  if(e.target.closest('.correlati-row')) return;
  if(e.target.closest('[data-open-corr]')) return;
  document.querySelectorAll('.correlati-row').forEach(r=>r.style.display='none');
  document.querySelectorAll('.linked-open-btn').forEach(b=>b.classList.remove('rotated'));
});

(function initDragDrop(){
  const tbody = document.getElementById('tableBody');
  if(!tbody) return;
  let ctx = { artId:null, row:null, active:false, timer:null, startX:0, startY:0, moved:false };
  const LONG_PRESS_MS = 500;
  const MOVE_TOLERANCE = 10;

  function getPoint(e){
    if(e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    if(e.changedTouches && e.changedTouches[0]) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }
  function cancelTimer(){ if(ctx.timer){clearTimeout(ctx.timer);ctx.timer=null;} }
  function reset(){
    cancelTimer();
    if(ctx.row) ctx.row.classList.remove('dragging');
    document.body.classList.remove('drag-active');
    ctx = { artId:null, row:null, active:false, timer:null, startX:0, startY:0, moved:false };
  }
  function onStart(e){
    if(selectionMode) return;
    const tgt = e.target;
    if(tgt.tagName === 'INPUT' || tgt.closest('button') || tgt.closest('.correlati-row')) return;
    const row = tgt.closest('tr[data-art]');
    if(!row) return;
    const pt = getPoint(e);
    ctx.startX = pt.x; ctx.startY = pt.y;
    ctx.row = row; ctx.artId = row.dataset.art;
    ctx.active = false; ctx.moved = false;
    cancelTimer();
    ctx.timer = setTimeout(()=>{
      ctx.active = true;
      row.classList.add('dragging');
      document.body.classList.add('drag-active');
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
    }, LONG_PRESS_MS);
  }
  function onMove(e){
    if(!ctx.row) return;
    const pt = getPoint(e);
    const dx = Math.abs(pt.x - ctx.startX);
    const dy = Math.abs(pt.y - ctx.startY);
    if(!ctx.active){
      if(dx > MOVE_TOLERANCE || dy > MOVE_TOLERANCE){
        cancelTimer(); ctx.row = null; ctx.artId = null;
      }
      return;
    }
    if(e.cancelable) e.preventDefault();
    const el = document.elementFromPoint(pt.x, pt.y);
    const targetRow = el && el.closest('tr[data-art]');
    if(!targetRow || targetRow === ctx.row) return;
    if(!ctx.artId) return;
    swapArticleOrder(ctx.artId, targetRow.dataset.art);
  }
  function onEnd(){
    if(ctx.active){
      const row = ctx.row;
      setTimeout(()=>{
        if(row) row.classList.remove('dragging');
        document.body.classList.remove('drag-active');
      }, 60);
    }
    reset();
  }
  function swapArticleOrder(fromId, toId){
    const owner = getCurrentArticleOwner();
    if(!owner) return;
    const fromIdx = owner.articles.findIndex(a => a.id === fromId);
    const toIdx = owner.articles.findIndex(a => a.id === toId);
    if(fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
    if(!ctx.moved) pushUndo('Riordino articoli');
    ctx.moved = true;
    const [art] = owner.articles.splice(fromIdx, 1);
    owner.articles.splice(toIdx, 0, art);
    renderTable();
    const newRow = document.querySelector('tr[data-art="'+fromId+'"]');
    if(newRow){ newRow.classList.add('dragging'); ctx.row = newRow; }
    saveState();
  }
  tbody.addEventListener('touchstart', onStart, {passive:true});
  tbody.addEventListener('touchmove', onMove, {passive:false});
  tbody.addEventListener('touchend', onEnd);
  tbody.addEventListener('touchcancel', onEnd);
  tbody.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
})();

function searchAllArticles(query){
  const q = normalizeStr(query);
  if(q.length < 2) return [];
  const matches = [];
  const existingCodes = new Set();
  for(const cat of state.categories){
    for(const a of cat.articles){
      if(a.code) existingCodes.add(normalizeStr(a.code));
      if(a.id === editingArticleId) continue;
      const hay = normalizeStr(a.name + ' ' + (a.code||''));
      if(smartMatch(hay, q)){
        matches.push({ article: a, category: cat, score: smartScore(hay, q), source: 'settore' });
      }
    }
  }
  const rub = getRubrica();
  for(let i = 0; i < rub.length; i++){
    const r = rub[i];
    if(!r || !r.cod) continue;
    if(existingCodes.has(normalizeStr(r.cod))) continue;
    const hay = normalizeStr((r.cod||'') + ' ' + (r.nome||''));
    if(smartMatch(hay, q)){
      matches.push({
        article: { id: null, name: r.nome, code: r.cod, unit: r.unit || 'pz', price: 0, cost: 0 },
        category: null, score: smartScore(hay, q) - 5, source: 'rubrica'
      });
    }
    if(matches.length > 200) break;
  }
  matches.sort((a,b) => b.score - a.score);
  return matches.slice(0, 50);
}

function renderLinkResults(results){
  const box = $('#linkResults');
  if(!results.length){
    box.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:16px 0;font-size:12.5px">Nessun risultato</div>';
    return;
  }
  box.innerHTML = results.map((r,i)=>{
    const isRub = r.source === 'rubrica';
    const code = r.article.code || '—';
    const srcBadge = isRub
      ? '<span class="li-source">📚 Rubrica</span>'
      : '<span class="search-cat-badge">📁 '+esc(r.category.name)+'</span>';
    return `
      <div class="rubrica-item" data-linkidx="${i}">
        <div class="rb-name"><span class="rb-code">${esc(code)}</span>${esc(r.article.name)} ${srcBadge}</div>
      </div>`;
  }).join('');
  box.querySelectorAll('[data-linkidx]').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx = parseInt(el.dataset.linkidx, 10);
      const r = results[idx];
      if(!r) return;
      pendingLinkArticleId = r.article.id;
      pendingLinkFromRubrica = (r.source === 'rubrica') ? r : null;
      $('#linkChosen').style.display = 'block';
      $('#linkChosenName').textContent = r.article.name;
      if(r.source === 'rubrica'){
        $('#linkChosenMeta').innerHTML = 'Cod. ' + (r.article.code||'—') +
          ' · <span style="color:var(--yellow)">📚 Sarà aggiunto al settore corrente</span>';
      } else {
        $('#linkChosenMeta').textContent = 'Cod. ' + (r.article.code||'—') + ' · ' + r.category.name;
      }
      $('#linkNote').value = '';
      $('#linkRequired').value = 'opt';
    });
  });
}

function updateLinkedBadgeInTable(artId){

  const n = (art.linkedArticles||[]).length;
  if(n === 0){ if(oldBadge) oldBadge.remove(); return; }
  if(oldBadge){ oldBadge.textContent = '🔗 ' + n; }
  else {
    const wrap = tr.querySelector('.name-wrap');
    if(wrap){
      const b = document.createElement('button');
      b.className = 'linked-btn';
      b.dataset.linkedOpen = art.id;
      b.textContent = '🔗 ' + n;
      b.title = 'Articoli correlati';
      const codeBadge = wrap.querySelector('.art-code-badge');
      if(codeBadge && codeBadge.nextSibling) wrap.insertBefore(b, codeBadge.nextSibling);
      else if(codeBadge) wrap.appendChild(b);
      else wrap.appendChild(b);
    }
  }
}

$('#btnLinkConfirm').addEventListener('click', ()=>{
  const art = findArticle(editingArticleId);
  if(!art) return;
  let linkedId = pendingLinkArticleId;
  if(!linkedId && pendingLinkFromRubrica){
    const r = pendingLinkFromRubrica.article;
    if(!r || !r.code){ alert('Dati rubrica non validi.'); return; }
    const owner = getCurrentArticleOwner();
    if(!owner){ alert('Nessun settore attivo.'); return; }
    const existing = owner.articles.find(x => normalizeStr(x.code) === normalizeStr(r.code));
    if(existing){ linkedId = existing.id; }
    else {
      const now = new Date().toISOString();
      pushUndo('Aggiunto "'+r.name+'" al settore '+owner.name);
      const newArt = {
        id: uid(), name: r.name, code: r.code, unit: r.unit || 'pz',
        price: 0, cost: 0, margin: null,
        supplier: '', supplierCode: '', notes: 'Aggiunto dalla rubrica', photo: '',
        purchases: [], quantityDiscounts: [], linkedArticles: [],
        updatedAt: now,
        history: [{date:now, price:0, cost:0, prevPrice:0, prevCost:0, note:'Aggiunto da rubrica'}]
      };
      owner.articles.push(newArt);
      linkedId = newArt.id;
      saveState();
    }
  }
  if(!linkedId){ alert('Seleziona prima un articolo dalla lista.'); return; }
  if(!Array.isArray(art.linkedArticles)) art.linkedArticles = [];
  if(art.linkedArticles.some(la => la.articleId === linkedId)){
    alert('Questo articolo è già correlato.'); return;
  }
  art.linkedArticles.push({
    articleId: linkedId,
    note: $('#linkNote').value.trim().slice(0,200),
    required: $('#linkRequired').value === 'req'
  });

    prevPrice: oldPrice, prevCost: linkedArt.cost,

});

function deleteArticle(id){

  pushUndo('Elimina "'+art.name+'"');
  for(const c of state.categories){

  selectedArticles.delete(id);
  saveState();render();
}

/* -------- SUGGERIMENTO PREZZO -------- */
function computeSuggested(){
  const art=findArticle(editingArticleId);if(!art)return null;
  const cost=num($('#edCost').value);if(cost<=0)return null;
  let margin=parseFloat($('#edMargin').value);
  if(isNaN(margin)){
    const cat=getCurrentArticleOwner();
    margin=(cat&&typeof cat.defaultMargin==='number')?cat.defaultMargin:(state.meta.globalMargin||40);
  }
  return cost*(1+margin/100);
}
function updateSuggestBox(){
  const s=computeSuggested();const box=$('#edSuggestBox');
  if(!s){box.style.display='none';return;}
  const current=num($('#edPrice').value);
  if(Math.abs(s-current)<0.01){box.style.display='none';return;}
  box.style.display='flex';
  $('#edSuggestVal').textContent=fmtEuro(s)+unitSuffix($('#edUnit').value);
}
$('#edApplySuggest').addEventListener('click',()=>{
  const s=computeSuggested();if(!s)return;
  $('#edPrice').value=s.toFixed(2);updateSuggestBox();
});
['#edCost','#edPrice','#edMargin','#edUnit'].forEach(sel=>{
  document.addEventListener('input',e=>{if(e.target.matches(sel))updateSuggestBox();});
});
$('#edUnit').addEventListener('change',()=>{updateUnitLabels();updateSuggestBox();});

/* -------- LOTTI -------- */
function renderLotti(){
  const art=findArticle(editingArticleId);if(!art)return;
  const list=$('#lottiList');
  const purchases=[...art.purchases].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last=purchases[0]?num(purchases[0].cost):0;
  const totalQty=purchases.reduce((s,p)=>s+num(p.qty),0);
  const avg=totalQty>0?purchases.reduce((s,p)=>s+num(p.cost)*num(p.qty),0)/totalQty:0;
  $('#lottoLast').textContent=last>0?fmtEuro(last):'—';
  $('#lottoAvg').textContent =avg>0?fmtEuro(avg):'—';
  if(!purchases.length){
    list.innerHTML='<div style="text-align:center;color:var(--text-mute);padding:16px 0;font-size:12.5px">'+
      'Nessun acquisto registrato.</div>';
    return;
  }
  list.innerHTML=purchases.map((p,i)=>{
    const isLatest=i===0;
    return `
      <div class="lotto-row ${isLatest?'latest':''}" data-pid="${p.id}">
        <div><div class="lbl">Data</div>
          <input type="date" data-lf="date" value="${new Date(p.date).toISOString().slice(0,10)}"></div>
        <div><div class="lbl">Costo unit. ${isLatest?'<span style="color:var(--yellow)">(ultimo)</span>':''}</div>
          <input type="number" step="0.01" data-lf="cost" value="${num(p.cost).toFixed(2)}"></div>
        <div><div class="lbl">Q.tà</div>
          <input type="number" step="1" data-lf="qty" value="${num(p.qty)}"></div>
        <div><div class="lbl">Usa come costo</div>
          <button class="btn btn-sm" data-usecost="${p.id}" ${!isLatest?'disabled':''} style="width:100%">Usa</button></div>
        <div style="text-align:right">
          <button class="btn btn-sm" data-delp="${p.id}" style="color:var(--red)">🗑</button></div>
      </div>`;
  }).join('');
}

/* -------- STORICO -------- */
function renderHistory(){
  const art=findArticle(editingArticleId);if(!art)return;
  const box=$('#historyList');
  if(!art.history.length){
    box.innerHTML='<div style="text-align:center;color:var(--text-mute);padding:24px 0">Nessuna variazione.</div>';
    return;
  }
  const list=[...art.history].reverse();
  box.innerHTML=list.map((h,i)=>{
    const isCur=i===0;
    const prev=h.prevPrice!=null?h.prevPrice:null;
    const delta=prev!=null?(h.price-prev):0;
    const dHtml=(delta!==0 && prev)
      ?'<span class="h-delta '+(delta>0?'up':'down')+'">'+(delta>0?'▲':'▼')+' '+Math.abs(delta).toFixed(2)+' €</span>'
      :'<span class="h-delta">—</span>';
    return `
      <div class="history-item ${isCur?'current':''}">
        <div class="h-date">${fmtDate(h.date)}</div>
        <div class="h-price">Vendita: ${fmtEuro(h.price)}</div>
        <div class="h-cost">Costo: ${fmtEuro(h.cost)}</div>
        <div>${dHtml}</div>
      </div>`;
  }).join('');
}

$('#btnExport').addEventListener('click',()=>{

$('#btnImport').addEventListener('click',()=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.addEventListener('change',()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        const normalized=normalizeState(p);
        if(!confirm('Sovrascrivere i dati ONLINE con questo file?'))return;
        pushUndo('Import backup');
        state=normalized;
        const firstTop = state.categories.find(c=>!c.parentId);
        activeCategoryId = firstTop ? firstTop.id : null;
        activeSubCategoryId = null;
        selectedArticles.clear();
        searchQuery=''; const si=$('#searchInput'); if(si) si.value='';
        saveState();render();
        alert('✅ Backup caricato online.');
      }catch(err){alert('❌ File non valido: '+err.message);}
    };
    r.onerror=()=>alert('Errore lettura file.');
    r.readAsText(f);
  });
  inp.click();
});

function doActualPrint(){
  const isSearching = !!searchQuery.trim();
  const owner = getCurrentArticleOwner();
  if(!isSearching && !owner)return alert('Nessun settore selezionato.');

  let articles=getFilteredArticles();
  if(selectionMode && selectedArticles.size>0){
    articles=articles.filter(a=>selectedArticles.has(a.id));
  }
  if(!articles.length)return alert('Nessun articolo da stampare.');

  const n = articles.length;
  const compact = n > 16;
  let minHeightStyle = '';
  if(n > 16){
    const usableMM = 245;
    const gapMM = 2 * (n-1);
    let hRow = (usableMM - gapMM) / n;
    hRow = Math.max(9, hRow);
    minHeightStyle = ` style="min-height:${hRow}mm"`;
  }

  const rowsHtml = articles.map(a=>{
    const codeHtml = a.code ? ' <span class="art-code-inline">'+esc(a.code)+'</span>' : '';
    return `
      <div class="articolo"${minHeightStyle}>
        <div class="art-info">
          <div class="art-nome">${esc(a.name)}${codeHtml}</div>
        </div>
        <div class="art-prezzo-box">
          <div class="art-prezzo-label">Prezzo</div>
          <div class="art-prezzo-empty"></div>
          <div class="art-prezzo-unit">€/${esc(a.unit||'pz')}</div>
        </div>
      </div>`;
  }).join('');

  const titleText = isSearching
    ? 'Ricerca: '+searchQuery.trim()
    : (owner ? owner.name : 'Articoli');

  $('#printArea').innerHTML = `
    <div class="print-header">
      <div class="print-title">${esc(titleText)}</div>
      <div class="print-date-line">Data: <span class="print-date-blank"></span></div>
    </div>
    <div class="articoli-list ${compact?'compact':''}">
      ${rowsHtml}
    </div>`;

  setTimeout(()=>window.print(),80);
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f'){
    e.preventDefault();$('#searchInput').focus();$('#searchInput').select();
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='n'){e.preventDefault();$('#btnAddArt').click();}
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='p'){e.preventDefault();toggleSelectionMode();}
  const tag=document.activeElement && document.activeElement.tagName;
  const inInput=(tag==='INPUT'||tag==='TEXTAREA');
  if(!inInput){
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){
      e.preventDefault();undo();
    }
    if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z' && e.shiftKey))){
      e.preventDefault();redo();
    }
  }
  if(e.key==='Escape'){
    if(searchQuery.trim()){
      searchQuery=''; const si=$('#searchInput'); if(si){si.value='';}
      renderTable(); return;
    }
    if(selectionMode){ exitSelectionMode(); return; }
    $$('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
  }
});

/* ============================================================================
   WALKTHROUGH
   ========================================================================== */
let walkArticles=[];
let walkIndex=0;
let walkUnlocked=false;
let walkUndoSnapshot=null;

function openWalkthrough(){
  if(selectionMode) exitSelectionMode();
  const articles=getFilteredArticles();
  if(!articles.length) return alert('Nessun articolo da mostrare nel giro.');
  walkArticles=articles.map(a=>a.id);
  walkIndex=0;
  walkUnlocked=false;
  walkUndoSnapshot=null;
  walkCorrOpen=false;
  updateWalkLockUI();
  renderWalkCard();
  $('#walkthrough').classList.add('open');
}
function closeWalkthrough(){walkUndoSnapshot=null;walkCorrOpen=false;$('#walkthrough').classList.remove('open');}
function walkCurrentArticle(){if(!walkArticles.length)return null;return findArticle(walkArticles[walkIndex]);}
function walkNext(){if(walkIndex<walkArticles.length-1){walkUndoSnapshot=null;walkCorrOpen=false;walkIndex++;renderWalkCard();}}
function walkPrev(){if(walkIndex>0){walkUndoSnapshot=null;walkCorrOpen=false;walkIndex--;renderWalkCard();}}
function updateWalkLockUI(){
  const btn=$('#walkLock');
  if(walkUnlocked){btn.classList.add('unlocked');btn.innerHTML='🔓 Modifica attiva — tocca per bloccare';}
  else{btn.classList.remove('unlocked');btn.innerHTML='🔒 Bloccato — tocca per modificare';}
}
function recalcWalkTotal(){
  const a = walkCurrentArticle();
  if(!a) return;
  let total = a.price;
  let count = 0;
  document.querySelectorAll('.walk-corr-panel input[type=checkbox]:checked').forEach(cb=>{
    total += parseFloat(cb.dataset.price) || 0;
    count++;
  });
  const val = document.querySelector('.wct-value');
  if(val) val.textContent = fmtEuro(total);
  const cnt = document.querySelector('.wct-count');
  if(cnt) cnt.textContent = count === 0 ? '(nessun correlato)' : '(' + count + ' correlato' + (count===1?'':'i') + ')';
}
function renderWalkCard(){
  const a=walkCurrentArticle();
  const wrap=$('#walkCardWrap');
  if(!a){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-mute)">Articolo non trovato.</div>';return;}
  $('#walkIdx').textContent=walkIndex+1;
  $('#walkTot').textContent=walkArticles.length;
  $('#walkPrevBtn').disabled=walkIndex===0;
  $('#walkNextBtn').disabled=walkIndex>=walkArticles.length-1;

  const age=ageInfo(a.updatedAt);
  const photoHtml=a.photo?'<div class="walk-photo"><img src="'+esc(a.photo)+'" alt=""></div>':'';
  const supLine=[a.supplier,a.supplierCode].filter(Boolean).join(' • ');
  const codeHtml = a.code ? '<span class="walk-code">'+esc(a.code)+'</span>' : '';

  const scontiHtml=a.quantityDiscounts && a.quantityDiscounts.length
    ?a.quantityDiscounts.slice().sort((x,y)=>x.minQty-y.minQty)
      .map(s=>'<span class="walk-sconto-pill">'+esc(scontoLabel(s,a.unit))+'</span>').join('')
    :'<span style="color:var(--text-mute);font-size:13px">Nessuno sconto quantità</span>';

  const lastUpdateHtml = '<div style="font-size:22px;font-weight:800;color:var(--yellow);letter-spacing:-.3px">'+
    fmtDate(a.updatedAt)+'</div>';

  const notesHtml=a.notes
    ?'<div class="scont">'+esc(a.notes)+'</div>'
    :'<span style="color:var(--text-mute);font-size:13px">Nessuna nota</span>';

  const linkedCount = (a.linkedArticles||[]).length;
  const plusBtn = linkedCount > 0
    ? '<button class="linked-open-btn" id="walkCorrToggle" title="Apri calcolatore correlati">+</button>'
    : '';

  const linkedList = (a.linkedArticles||[]).map(la=>{
    const l = findArticle(la.articleId);
    if(!l) return '';
    const badge = la.required
      ? '<span class="li-badge li-req">OBBL.</span>'
      : '<span class="li-badge li-opt">OPT.</span>';
    return `<div class="linked-item">
      <span class="li-code">${esc(l.code||'—')}</span>
      <div style="flex:1;min-width:0">
        <div class="li-name">${esc(l.name)}</div>
        ${la.note?'<div class="li-note">'+esc(la.note)+'</div>':''}
      </div>
      <div style="font-size:14px;font-weight:800;color:var(--yellow);white-space:nowrap">${fmtEuro(l.price)}</div>
      ${badge}
    </div>`;
  }).filter(Boolean).join('');
  const linkedHtml = linkedList
    ? linkedList
    : '<span style="color:var(--text-mute);font-size:13px">Nessun correlato</span>';

  const corrPanelHtml = (linkedCount > 0) ? `
    <div class="walk-corr-panel" id="walkCorrPanel" style="display:${walkCorrOpen?'block':'none'}">
      <div class="wcp-title">🔗 Correlati — spunta per calcolare</div>
      <div class="wcp-list">
        ${(a.linkedArticles||[]).map(la=>{
          const l = findArticle(la.articleId);
          if(!l) return '';
          return `<label class="wcp-check">
            <input type="checkbox" data-price="${l.price}" data-corr="${l.id}">
            <span class="cc-code">${esc(l.code||'—')}</span>
            <span class="cc-name">${esc(l.name)}</span>
            <span class="cc-price">${fmtEuro(l.price)}</span>
          </label>`;
        }).filter(Boolean).join('')}
      </div>
      <div class="wcp-total">
        <span class="wct-label">Totale</span>
        <div class="wct-right">
          <span class="wct-value">${fmtEuro(a.price)}</span>
          <span class="wct-count">(nessun correlato)</span>
        </div>
      </div>
    </div>` : '';

  const priceCellClass='walk-price-cell'+(walkUnlocked?' editable':'');

  wrap.innerHTML=`
    <div class="walk-card">
      ${photoHtml}
      <div class="walk-name-row">
        <h2 class="walk-name">${esc(a.name)}</h2>
        ${codeHtml}
        ${plusBtn}
      </div>
      <div class="walk-meta">
        <span class="age-badge ${age.cls}" style="margin-left:0">${age.label}</span>
        <span class="sep">•</span>Unità: <b style="color:var(--text)">${esc(a.unit||'pz')}</b>
        ${supLine?'<span class="sep">•</span>'+esc(supLine):''}
      </div>

      <div class="walk-price-grid">
        <div class="${priceCellClass}" data-cell="price">
          <span class="lbl">Prezzo vendita</span>
          <span class="val">${fmtEuro(a.price)}${esc(unitSuffix(a.unit))}</span>
          <input type="number" step="0.01" min="0" class="edit-input" data-wf="price" value="${a.price.toFixed(2)}">
        </div>
      </div>

      ${corrPanelHtml}

      <div class="walk-section"><div class="stitle">💰 Sconti quantità</div>
        <div class="walk-sconti-list">${scontiHtml}</div></div>
      <div class="walk-section"><div class="stitle">🔗 Completabile con</div>${linkedHtml}</div>
      <div class="walk-section"><div class="stitle">📅 Ultima modifica</div>${lastUpdateHtml}</div>
      <div class="walk-section"><div class="stitle">📝 Note magazzino</div>${notesHtml}</div>
    </div>`;

  const corrToggle = wrap.querySelector('#walkCorrToggle');
  if(corrToggle){
    corrToggle.addEventListener('click', (e)=>{
      e.stopPropagation();
      walkCorrOpen = !walkCorrOpen;
      const panel = wrap.querySelector('#walkCorrPanel');
      if(panel){
        panel.style.display = walkCorrOpen ? 'block' : 'none';
        corrToggle.classList.toggle('rotated', walkCorrOpen);
        if(walkCorrOpen) recalcWalkTotal();
      }
    });
    if(walkCorrOpen) corrToggle.classList.add('rotated');
  }
  wrap.querySelectorAll('#walkCorrPanel input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', recalcWalkTotal);
  });

  if(walkUnlocked){
    const inp=wrap.querySelector('.edit-input');
    if(inp) setTimeout(()=>inp.focus(),50);
  }
}
$('#walkClose').addEventListener('click',closeWalkthrough);
$('#walkPrevBtn').addEventListener('click',walkPrev);
$('#walkNextBtn').addEventListener('click',walkNext);
$('#walkLock').addEventListener('click',()=>{
  walkUnlocked=!walkUnlocked;walkUndoSnapshot=null;
  updateWalkLockUI();renderWalkCard();
});
$('#walkCardWrap').addEventListener('focusin',e=>{
  if(e.target.classList.contains('edit-input')) walkUndoSnapshot=JSON.stringify(state);
});
$('#walkCardWrap').addEventListener('change',e=>{
  if(!e.target.classList.contains('edit-input'))return;
  if(!walkUnlocked) return;
  const a=walkCurrentArticle();if(!a)return;
  const f=e.target.dataset.wf;
  const newVal=num(e.target.value);
  const oldVal=a[f];
  if(oldVal===newVal){walkUndoSnapshot=null;return;}
  if(walkUndoSnapshot){
    try{
      undoStack.push({label:'Modifica '+(f==='price'?'prezzo':'costo')+' in giro',snapshot:walkUndoSnapshot});
      if(undoStack.length>MAX_UNDO) undoStack.shift();
      redoStack=[];updateUndoButtons();
    }catch(err){}
    walkUndoSnapshot=null;
  }
  a[f]=newVal;
  a.history.push({
    date:new Date().toISOString(),price:a.price,cost:a.cost,
    prevPrice:f==='price'?oldVal:a.price,prevCost:f==='cost'?oldVal:a.cost,
    operator:state.meta.operator||''
  });
  a.updatedAt=new Date().toISOString();
  state.meta.lastRevision=a.updatedAt;
  saveState();renderWalkCard();refreshRow(a);
});
document.addEventListener('keydown',e=>{
  if(!$('#walkthrough').classList.contains('open'))return;
  if(e.key==='Escape'){closeWalkthrough();return;}
  const tag=document.activeElement && document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='ArrowRight'){if(walkIndex<walkArticles.length-1)walkNext();e.preventDefault();}
  if(e.key==='ArrowLeft'){ if(walkIndex>0)walkPrev();e.preventDefault();}
});

(function initCompactHeader(){
  const content=document.querySelector('#mainContent');
  if(!content) return;

  let lastScroll=0;
  let ticking=false;
  let isCompact=false;
  let accumulated=0;
  let lastToggleTime=0;

  const COOLDOWN_MS=300;
  const ENTER_ACCUM=80;
  const EXIT_ACCUM=-30;
  const TOP_THRESHOLD=20;
  const ENTER_MIN_Y=60;
  const MOBILE_MAX=1024;

  function enterCompact(){
    if(isCompact) return;
    isCompact=true;
    document.body.classList.add('compact');
    lastToggleTime=Date.now();
    accumulated=0;
  }
  function exitCompact(){
    if(!isCompact) return;
    isCompact=false;
    document.body.classList.remove('compact');
    lastToggleTime=Date.now();
    accumulated=0;
  }

  function update(){
    const y = content.scrollTop;
    const now = Date.now();

    if(window.innerWidth > MOBILE_MAX){
      if(isCompact) exitCompact();
      ticking=false;
      return;
    }

    if(y < TOP_THRESHOLD){
      if(isCompact) exitCompact();
      lastScroll = y;
      accumulated = 0;
      ticking=false;
      return;
    }

    if((now - lastToggleTime) < COOLDOWN_MS){
      lastScroll = y;
      ticking=false;
      return;
    }

    const delta = y - lastScroll;
    accumulated += delta;
    lastScroll = y;

    if(accumulated > 600) accumulated = 600;
    if(accumulated < -600) accumulated = -600;

    if(!isCompact && accumulated > ENTER_ACCUM && y > ENTER_MIN_Y){
      enterCompact();
    } else if(isCompact && accumulated < EXIT_ACCUM){
      exitCompact();
    }

    ticking=false;
  }

  content.addEventListener('scroll',()=>{
    if(!ticking){
      requestAnimationFrame(update);
      ticking=true;
    }
  }, { passive: true });

  window.addEventListener('resize', ()=>{
    if(window.innerWidth > MOBILE_MAX){
      document.body.classList.remove('compact');
      isCompact=false;
    }
  });

  window.__resetCompact=function(){
    document.body.classList.remove('compact');
    isCompact=false;
    lastScroll=0;
    accumulated=0;
    lastToggleTime=0;
  };
})();

window.__cloudReady = function(){
  cloudReady = true;
  const firstTop = state.categories.find(c=>!c.parentId);
  if(firstTop && !activeCategoryId){
    activeCategoryId = firstTop.id;
  }
  render();
  updateInfoBar();
  console.log('☁️ App pronta con dati cloud');
};

window.__cloudFallbackLocal = function(){
  console.log('🔴 Cloud non raggiungibile — nessun dato caricato dal locale');
  cloudReady = true;
  state = { version: APP_VERSION, meta:{operator:'',lastRevision:new Date().toISOString(),globalMargin:40}, categories: [] };
  activeCategoryId = null;
  activeSubCategoryId = null;
  render();
  updateInfoBar();
};

(function init(){
  try{
    loadTheme();
    loadClientMode();
    state = { version: APP_VERSION, meta:{operator:'',lastRevision:new Date().toISOString(),globalMargin:40}, categories: [] };
    activeCategoryId = null;
    activeSubCategoryId = null;
    cloudReady = false;

    render();
    updateInfoBar();
    updateUndoButtons();
    initRubrica();

    setTimeout(()=>{
      try{ if(window.cloudInit) window.cloudInit(); }
      catch(e){ console.warn('Cloud init:',e); window.__cloudFallbackLocal(); }
    }, 300);
  }catch(e){
    console.error('Init error:',e);
    alert('Errore avvio: '+e.message);
  }
  console.log('%cRattazzi Cartellini v4.3 avviato','color:#ffcc00;font-weight:bold');
})();
</script>
